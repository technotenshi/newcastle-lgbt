services:
  app:
    build: .
    container_name: newcastle-lgbt-app
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    env_file:
      - .env

  prod:
    image: nginx:latest
    ports:
      - "8081:80"
    working_dir: /usr/share/nginx/html
    volumes:
      - ./dist:/usr/share/nginx/html
