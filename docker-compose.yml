services:
  app:
    build: .
    container_name: newcastle-lgbt-app
    command: ./node_modules/.bin/nuxt dev --host 0.0.0.0 --port 3000
    environment:
      - HOST=0.0.0.0
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - .:/app

  preview:
    build: .
    container_name: newcastle-lgbt-preview
    command: ./node_modules/.bin/nuxt preview --port 3000
    environment:
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
      - PORT=3000
    ports:
      - "3001:3000"
    volumes:
      - .:/app
