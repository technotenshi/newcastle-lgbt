# Renovate (renovate.json) owns routine version updates. Setting the pull
# request limit to 0 turns off Dependabot version updates for this ecosystem
# and leaves Dependabot security updates, which come from the repository's
# Dependabot alerts and security updates settings, untouched.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
