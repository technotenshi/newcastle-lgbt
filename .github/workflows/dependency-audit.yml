# Fails on critical or high dependency advisories that have no entry in the
# exception register, and on register entries past their review date. Moderate
# findings and deprecations are logged as warnings. See
# docs/maintenance/audit-exceptions.md.
#
# This is deliberately not a required check on every pull request: new
# advisories appear independently of what a pull request changes, so it runs on
# pushes to main, weekly, and on pull requests that change the dependency
# manifest, the lockfile, or the gate itself.

name: Dependency audit

on:
  push:
    branches: ["main"]
  schedule:
    # Mondays at 15:00 UTC.
    - cron: "0 15 * * 1"
  pull_request:
    branches: ["main"]
    paths:
      - package.json
      - yarn.lock
      - scripts/audit-gate.mjs
      - scripts/audit-gate.test.mjs
      - docs/maintenance/audit-exceptions.md
      - .github/workflows/dependency-audit.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The audit reads package.json and yarn.lock only, so there is no
      # `yarn install` here and no dependency install scripts run.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Test the audit gate
        run: node --test scripts/audit-gate.test.mjs

      - name: Audit dependencies
        run: node scripts/audit-gate.mjs
